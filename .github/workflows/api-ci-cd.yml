name: API CI/CD

on:
  push:
    branches: ["main"]
    paths:
      - "services/api/**"
      - ".github/workflows/api-ci-cd.yml"
  pull_request:
    paths:
      - "services/api/**"
      - ".github/workflows/api-ci-cd.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: soulmatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d soulmatch"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: services/api
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: services/api
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/soulmatch
          JWT_SECRET: ci-test-secret-1234567890abcdefghij
          PII_ENCRYPTION_KEY: ci-test-pii-key-1234567890abcdef
        run: |
          alembic upgrade head
          pytest -q
          
