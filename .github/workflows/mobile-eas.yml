name: Mobile EAS Build and Submit

on:
  # Manual trigger only — add EXPO_TOKEN to repo secrets before enabling push builds
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build (all | ios | android)"
        required: true
        default: "all"
        type: choice
        options: ["all", "ios", "android"]
      profile:
        description: "EAS build profile"
        required: true
        default: "production"
        type: choice
        options: ["production", "preview"]
      submit:
        description: "Submit to stores after build?"
        required: true
        default: "false"
        type: choice
        options: ["true", "false"]

jobs:
  eas-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Setup EAS
        run: npm install -g eas-cli
      - name: EAS Build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_ENV: production
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
        run: eas build --platform ${{ github.event.inputs.platform }} --profile ${{ github.event.inputs.profile }} --non-interactive
      - name: EAS Submit
        if: github.event.inputs.submit == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas submit --platform ${{ github.event.inputs.platform }} --profile ${{ github.event.inputs.profile }} --non-interactive
