services:
  # ── API (FastAPI / Gunicorn) ──────────────────────────────────────────────
  - type: web
    name: soulmatch-api
    runtime: python
    rootDir: services/api
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python scripts/pre_deploy.py
    startCommand: bash scripts/start.sh
    plan: starter          # upgrade to standard when you need more RAM
    region: oregon         # change to match your users (e.g. frankfurt)
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: soulmatch-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PII_ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false          # set manually in Render dashboard
      - key: CORS_ALLOW_ORIGINS
        value: https://soulmatch.app,https://www.soulmatch.app,https://app.soulmatch.app,https://eliyasekulova-lang.github.io
      - key: APP_SUPPORT_EMAIL
        value: support@soulmatch.app
      - key: APP_POLICY_BASE_URL
        value: https://soulmatch.app/legal
      - key: APP_ACCOUNT_DELETE_URL
        value: https://soulmatch.app/account/delete
      - key: JWT_ACCESS_EXPIRE_MINUTES
        value: "30"
      - key: JWT_REFRESH_EXPIRE_DAYS
        value: "30"
      - key: AUTH_RATE_LIMIT_PER_MINUTE
        value: "25"
      - key: AUTH_REFRESH_RATE_LIMIT_PER_MINUTE
        value: "15"
      - key: MESSAGE_SEND_RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: LOG_LEVEL
        value: INFO
      - key: MIN_SIGNUP_AGE_YEARS
        value: "18"
      - key: SENTRY_DSN
        sync: false          # paste your Sentry DSN in the Render dashboard
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SEED_DEMO_CANDIDATES
        value: "false"
      - key: STRIPE_SECRET_KEY
        sync: false          # paste sk_live_... from Stripe dashboard (never commit)
      - key: STRIPE_WEBHOOK_SECRET
        sync: false          # paste whsec_... from Stripe webhook endpoint settings
      - key: STRIPE_PREMIUM_PRICE_ID
        sync: false          # paste price_... for the $14.99/mo CAD price in Stripe
      - key: RESEND_API_KEY
        sync: false          # paste re_... from Resend dashboard (resend.com)
      - key: ANTHROPIC_API_KEY
        sync: false          # paste sk-ant-... from console.anthropic.com (never commit)
      - key: POSTHOG_API_KEY
        sync: false          # paste phc_... from app.posthog.com (never commit)

  # ── Landing page (static site) ────────────────────────────────────────────
  - type: web
    name: soulmatch-landing
    runtime: static
    rootDir: web
    buildCommand: ""        # plain HTML — no build step needed
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /app
        destination: https://app.soulmatch.app   # your Expo web deploy URL
      - type: rewrite
        source: /legal/privacy
        destination: /index.html
      - type: rewrite
        source: /legal/terms
        destination: /index.html

databases:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  - name: soulmatch-db
    databaseName: soulmatch
    user: soulmatch
    plan: starter           # upgrade to standard for production scale
    region: oregon          # must match the API service region
